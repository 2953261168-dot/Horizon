<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Horizon 新闻雷达</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        a { color: #0366d6; text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }
        h1 { border-bottom: 1px solid #eaecef; padding-bottom: 10px; }
        .date { font-weight: 600; margin-top: 30px; color: #586069; font-size: 1.2em; }
        ul { padding-left: 20px; margin-top: 10px; }
        li { margin-bottom: 10px; font-size: 1.1em; }
        #content { min-height: 200px; }
        .back-btn { display: inline-block; margin-bottom: 20px; font-weight: 600; }
        img { max-width: 100%; }
        blockquote { border-left: 4px solid #dfe2e5; padding-left: 15px; color: #6a737d; margin-left: 0; }
    </style>
</head>
<body>
    <div id="list-view">
        <h1>📰 Horizon 新闻雷达</h1>
        <p>你的专属 AI 驱动信息聚合日报</p>
        <div id="content">正在加载日报列表...</div>
    </div>
    <div id="article-view" style="display:none;">
        <a class="back-btn" onclick="showList()">← 返回日报列表</a>
        <div id="article-content"></div>
    </div>

    <script>
        // 加了一个时间戳，防止浏览器用旧缓存
        fetch('https://api.github.com/repos/2953261168-dot/Horizon/contents/_posts?ref=gh-pages&t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                const contentDiv = document.getElementById('content');
                if (!Array.isArray(data) || data.length === 0) {
                    contentDiv.innerHTML = '<p>暂无日报，请等待下次运行。</p>';
                    return;
                }
                
                data.sort((a, b) => b.name.localeCompare(a.name));
                
                let html = '';
                let currentDate = '';
                
                data.filter(file => file.name.endsWith('.md')).forEach(file => {
                    const match = file.name.match(/(\d{4}-\d{2}-\d{2})/);
                    if (match) {
                        const date = match[1];
                        if (date !== currentDate) {
                            if (currentDate !== '') html += '</ul>';
                            html += `<div class="date">${date}</div><ul>`;
                            currentDate = date;
                        }
                        
                        // 强制汉化文件名
                        let displayName = file.name;
                        if (displayName.includes('-en')) {
                            displayName = '🇬🇧 英文版日报';
                        } else if (displayName.includes('-zh')) {
                            displayName = '🇨🇳 中文版日报';
                        }

                        const rawUrl = file.download_url;
                        html += `<li><a onclick="loadArticle('${rawUrl}')">${displayName}</a></li>`;
                    }
                });
                if (currentDate !== '') html += '</ul>';
                contentDiv.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('content').innerHTML = '<p>加载失败，请刷新页面重试。</p>';
                console.error('Error:', error);
            });

        function loadArticle(url) {
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            const articleContent = document.getElementById('article-content');
            articleContent.innerHTML = '<p>正在加载内容...</p>';
            
            fetch(url)
                .then(res => res.text())
                .then(text => {
                    // 1. 剃掉头部没用的布局代码 (--- 包围的部分)
                    let cleanText = text.replace(/^---[\s\S]*?---/, '');
                    
                    // 2. 彻底清洗乱码
                    cleanText = cleanText.replace(/&#x27;/g, "'")
                                           .replace(/&quot;/g, '"')
                                           .replace(/&amp;/g, '&')
                                           .replace(/&lt;/g, '<')
                                           .replace(/&gt;/g, '>');
                                           
                    // 3. 渲染
                    articleContent.innerHTML = marked.parse(cleanText);
                })
                .catch(err => {
                    articleContent.innerHTML = '<p>内容加载失败。</p>';
                    console.error(err);
                });
        }

        function showList() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
        }
    </script>
</body>
</html>
