name: Send Morning Email
on:
  schedule:
    # 00:00 UTC = 08:00 Beijing. GitHub may delay scheduled jobs.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a connection test instead of the daily briefing'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: horizon-morning-email
  cancel-in-progress: false
jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: git fetch origin gh-pages --depth=1
      - name: Send today's Chinese briefing
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HORIZON_EMAIL_ADDRESS: ${{ secrets.HORIZON_EMAIL_ADDRESS }}
          HORIZON_EMAIL_TEST: ${{ inputs.test_mode && '1' || '0' }}
        run: uv run python scripts/send-morning.py
