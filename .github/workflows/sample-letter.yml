name: Horizon one-time sample delivery
on:
  push:
    branches: ['horizon/release-letterpress-20261022']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: git fetch origin gh-pages --depth=1
      - name: Send explicitly dated sample once
        env:
          HORIZON_TEST_EDITION: '2026-10-21'
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HORIZON_EMAIL_ADDRESS: ${{ secrets.HORIZON_EMAIL_ADDRESS }}
        run: uv run python scripts/send-morning.py

