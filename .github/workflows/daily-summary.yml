name: Prepare Daily Briefing
on:
  schedule:
    # 06:30 Beijing: allow time for AI analysis before the 08:00 email job.
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horizon-publish
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Preserve published briefing history
        run: bash scripts/restore-history.sh
      - name: Generate briefing without early email
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import json; p='data/config.json'; c=json.load(open(p)); c['email']['enabled']=False; json.dump(c,open(p,'w'),ensure_ascii=False)"
          uv run horizon --hours 24
      - uses: actions/upload-artifact@v4
        with:
          name: daily-summary
          path: data/summaries/
          if-no-files-found: error
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          enable_jekyll: true
